/* V3: statement-style quote with a strong hierarchy rather than a solid dark card. */
.quote{background:#fff;color:#302723;border:1px solid #e5dcd5;border-top:0;padding:0;overflow:hidden}.quotehead{background:#3c2d2a;color:#fff;padding:22px 26px;border-top:4px solid #e31825;gap:16px}.quotehead h2{margin:0;color:#fff}.quotehead>div{text-align:right}.quotehead small{color:#e7d9cf;margin:0}.quotehead .amount{color:#fff;margin:3px 0 0}.quote #details{padding:12px 26px 18px}.quote .line{border-bottom:1px solid #e8dfd8;padding:13px 12px;color:#302723}.quote .line>span:last-child{font-weight:650}.quote .formula{color:#74645c;margin:5px 0 0}.quote .line.subtotal{background:#3c2d2a;color:white;border:0;border-radius:8px;margin:7px 0;font-weight:700;padding:13px 12px}.quote .line.tax{background:#f8f4f0;border-bottom:1px solid #e8dfd8}.quote .line.tax:last-child{border-bottom:0;border-radius:0 0 7px 7px}.quote #hint{color:#74645c;padding:0 26px 18px;margin:0;font-size:14px}.quote #meta{display:none}.zoneinfo{font-weight:400;background:#f8f4f0;border-radius:8px;padding:10px 12px;line-height:1.6}.zoneinfo strong{font-size:11px;display:block;letter-spacing:.07em;text-transform:uppercase;color:#74645c;margin-bottom:3px}.zoneinfo span{font-size:13px;color:#302723}.zoneinfo[hidden]{display:none!important}@media(max-width:550px){.quotehead{display:flex;padding:18px;align-items:flex-start}.quotehead>div{text-align:left}.quote #details{padding:8px 12px 12px}.quote #hint{padding:0 18px 14px}.quotehead .amount{font-size:32px}.quote .line{padding:12px 8px}}

/* V4: glass, warm editorial surfaces and a moving furniture gallery. */
:root{--ink:#302723;--espresso:#3c2d2a;--red:#d71925;--paper:#f5eee7;--muted:#74645c}
body{background:linear-gradient(125deg,#f9f5f0 0%,#f0e5da 48%,#e5d5c8 100%);isolation:isolate}
main{position:relative;z-index:1;max-width:900px;padding:28px 30px 40px}

.brand{gap:18px}.brand img:first-child{width:174px}.brand img:last-child{width:60px}.preview{letter-spacing:.15em;font-size:10px}

.quote{padding:0;background:linear-gradient(125deg,#fffffffa,#fffaf5e8);border:1px solid #fff;box-shadow:0 20px 55px #3c2d2a19,inset 0 1px 0 #fff}.quotehead{position:relative;overflow:hidden;background:linear-gradient(120deg,#392a26,#594139 65%,#3d2e2a);border-top:3px solid var(--red);padding:22px 28px}.quotehead:before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff1 48%,transparent 63%);transform:translateX(-100%);animation:sheen 12s ease-in-out infinite}.quotehead>*{position:relative}.quotehead .amount{font-weight:690}.quote #details{padding:14px 26px 20px}.quote .line{padding:14px 13px}.quote .line.subtotal{background:linear-gradient(110deg,#49342e,#3c2d2a);border-radius:10px;margin:8px 0;box-shadow:0 5px 12px #3c2d2a13}.quote .line.tax{background:#f0e5db65}.quote .line.tax:last-child{border-radius:0 0 10px 10px}.note{margin-top:18px;max-width:700px}.motion-toggle{position:fixed;z-index:3;right:16px;bottom:14px;display:flex;gap:6px;align-items:center;background:#fffaf3d9;border:1px solid #b9a39677;border-radius:999px;padding:8px 12px;height:auto;color:#594139;font-size:11px;backdrop-filter:blur(10px)}
.gallery{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:strict}.gallery:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 15%,#fff9 0%,transparent 35%),radial-gradient(ellipse at 85% 75%,#bb927b28 0%,transparent 45%)}.piece{position:absolute;width:clamp(145px,19vw,300px);color:#806458;opacity:.30;filter:drop-shadow(0 18px 14px #4d35241a);animation:drift var(--duration,22s) ease-in-out infinite alternate;animation-delay:var(--delay,0s);will-change:transform}.piece svg{display:block;width:100%;height:auto}.sofa{left:-2%;top:22%;--duration:24s;--delay:-7s}.chair{right:-1%;top:10%;--duration:20s;--delay:-11s}.table{left:1%;bottom:4%;--duration:27s;--delay:-15s}.cabinet{right:0%;bottom:9%;--duration:25s;--delay:-3s}.gallery .piece:nth-of-type(even){color:#765447}.motion-paused .piece,.motion-paused .quotehead:before{animation-play-state:paused}@keyframes drift{0%{transform:translate3d(-7px,12px,0) rotate(-4deg)}100%{transform:translate3d(14px,-28px,0) rotate(4deg)}}@keyframes sheen{0%,68%{transform:translateX(-100%)}85%,100%{transform:translateX(100%)}}
